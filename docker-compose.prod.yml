services:
  # Celery's broker. The host runs its own redis, but containers can't reach it
  # across the bridge — `localhost` inside a container is the container itself.
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    ports: ["8002:8002"]
    env_file: [.env]
    # Set here rather than in .env: harbor init rewrites .env, and compose
    # `environment:` takes precedence over `env_file`.
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    restart: unless-stopped

  beat:
    build: .
    command: celery -A config beat --loglevel=info
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    restart: unless-stopped
